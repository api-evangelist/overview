aid: overview
name: Overview
description: >-
  Overview (overview.ai) builds AI-powered machine vision systems for
  manufacturing quality control. Its edge-computing platform runs vision
  transformer models directly on smart cameras with on-device NVIDIA GPUs to
  perform automated defect detection, assembly verification, and real-time
  inspection without cloud dependency. Overview serves connector, semiconductor,
  packaging, automotive, pharmaceutical, aerospace, renewable energy, food, and
  textile manufacturers, and integrates with factory-floor systems (PLCs, ERPs,
  SCADA) over MQTT and digital I/O rather than a public REST API. Backed by GV
  and Homebrew. Profiled in the API Evangelist network.
